name: Build Jiuzi AI Secretary IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.aesgcm
      - .github/workflows/build-ios.yml

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BUILD_KEY_B64: ${{ secrets.BUILD_KEY_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          sw_vers
          xcodebuild -version

      - name: Decrypt source with CryptoKit
        run: |
          cat > decrypt.swift <<'SWIFT'
          import Foundation
          import CryptoKit

          guard let keyString = ProcessInfo.processInfo.environment["BUILD_KEY_B64"],
                let keyData = Data(base64Encoded: keyString) else {
              fatalError("Missing BUILD_KEY_B64")
          }

          let blob = try Data(contentsOf: URL(fileURLWithPath: "source.aesgcm"))
          guard blob.count > 28 else { fatalError("Encrypted source is too short") }

          let nonceData = blob.subdata(in: 0..<12)
          let cipherAndTag = blob.subdata(in: 12..<blob.count)
          let ciphertext = Data(cipherAndTag.dropLast(16))
          let tag = Data(cipherAndTag.suffix(16))

          let nonce = try AES.GCM.Nonce(data: nonceData)
          let sealedBox = try AES.GCM.SealedBox(
              nonce: nonce,
              ciphertext: ciphertext,
              tag: tag
          )
          let key = SymmetricKey(data: keyData)
          let aad = Data("JIUZI-AI-SECRETARY-BUILD-v1".utf8)
          let plaintext = try AES.GCM.open(
              sealedBox,
              using: key,
              authenticating: aad
          )
          try plaintext.write(to: URL(fileURLWithPath: "source.zip"))
          SWIFT
          swift decrypt.swift
          rm decrypt.swift

      - name: Unpack source
        run: |
          mkdir source
          ditto -x -k source.zip source

      - name: Build unsigned iPhone app
        working-directory: source
        run: |
          xcodebuild \
            -project JiuziAISecretary.xcodeproj \
            -scheme JiuziAISecretary \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/JiuziAISecretary.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JiuziAISecretary-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JiuziAISecretary-unsigned-ipa
          path: JiuziAISecretary-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
