name: Build Jiuzi AI Secretary IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - source.aesgcm
      - .github/workflows/build-ios.yml

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BUILD_KEY_B64: ${{ secrets.BUILD_KEY_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          sw_vers
          xcodebuild -version

      - name: Decrypt source
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          key = base64.b64decode(os.environ["BUILD_KEY_B64"])
          blob = Path("source.aesgcm").read_bytes()
          nonce, ciphertext = blob[:12], blob[12:]
          plaintext = AESGCM(key).decrypt(nonce, ciphertext, b"JIUZI-AI-SECRETARY-BUILD-v1")
          Path("source.zip").write_bytes(plaintext)
          PY

      - name: Unpack source
        run: |
          mkdir source
          ditto -x -k source.zip source

      - name: Build unsigned iPhone app
        working-directory: source
        run: |
          xcodebuild \
            -project JiuziAISecretary.xcodeproj \
            -scheme JiuziAISecretary \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/JiuziAISecretary.app"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JiuziAISecretary-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JiuziAISecretary-unsigned-ipa
          path: JiuziAISecretary-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
